<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت اطلاعات نفرات و خطاها</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 ثبت اطلاعات نفرات و خطاها</h1>
      <p class="subtitle">افزودن، ویرایش و مدیریت اطلاعات</p>
    </header>

    <!-- فرم افزودن / ویرایش -->
    <section class="form-section">
      <h2 id="form-title">افزودن رکورد جدید</h2>
      <form id="record-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="personSelect">نام و نام خانوادگی</label>
            <select id="personSelect" required>
              <option value="">-- انتخاب نفر --</option>
            </select>
          </div>
          <div class="form-group">
            <label for="workstation">ایستگاه کاری</label>
            <input type="text" id="workstation" placeholder="مثال: خط تولید ۱" required>
          </div>
          <div class="form-group">
            <label for="lastName">نام خانوادگی</label>
            <input type="text" id="lastName" placeholder="خودکار پر می‌شود" readonly>
          </div>
          <div class="form-group">
            <label for="errorType">نوع خطا</label>
            <input type="text" id="errorType" placeholder="مثال: خطای کیفیت / تأخیر / ..." required>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">ذخیره</button>
          <button type="button" class="btn btn-secondary" id="cancel-btn" style="display:none;">انصراف</button>
        </div>
      </form>
    </section>

    <!-- جستجو و جدول -->
    <section class="table-section">
      <div class="table-header">
        <h2>لیست رکوردها</h2>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="جستجو بر اساس نام، کد، ایستگاه یا نوع خطا...">
        </div>
      </div>

      <div class="table-wrapper">
        <table id="records-table">
          <thead>
            <tr>
              <th>ردیف</th>
              <th>کد</th>
              <th>نام و نام خانوادگی</th>
              <th>ایستگاه کاری</th>
              <th>نام خانوادگی</th>
              <th>نوع خطا</th>
              <th>عملیات</th>
            </tr>
          </thead>
          <tbody id="records-body">
            <!-- رکوردها اینجا نمایش داده می‌شن -->
          </tbody>
        </table>
      </div>

      <p id="empty-message" class="empty-message">هنوز هیچ رکوردی ثبت نشده است.</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
